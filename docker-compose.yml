version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: oficina_db_container
    restart: always
    environment:
      MYSQL_DATABASE: oficina_db
      MYSQL_ROOT_PASSWORD: root  1327
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: